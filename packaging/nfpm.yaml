# nFPM config for frostyard-readd (frostyard/core ADR-0011, ADR-0058). make deb
# stages the tree and runs nfpm; the Version comes from DEB_VERSION.
name: frostyard-readd
arch: amd64
platform: linux
version: ${DEB_VERSION}
version_schema: none
section: net
priority: optional
maintainer: Brian Ketelsen <bketelsen@gmail.com>
description: |-
  frostread, a tailnet-only feed reader and read-later list, for lodge.
  The readd daemon, the readctl CLI, the Read app's manifest and web
  bundle, its systemd units and its sysusers.d entry. It runs as lodge's
  read app. Built for Snosi's sysext readd (core ADR-0058).
vendor: frostyard
homepage: https://github.com/frostyard/frostread
license: MIT
depends:
  - systemd
contents:
  - src: ./build/deb/root/usr
    dst: /usr
    type: tree
