# Read's system user, as /usr/lib/sysusers.d/frostread.conf. It may use
# lodge's inference socket (group lodge-apps), and is never in group lodge.
# Group lodge owns the app socket (SocketGroup=lodge in frostread.socket).
# This file declares the group too, so that the socket starts without
# lodge's own sysext (frostyard/core ADR-0058). The user is never a member
# of group lodge.
g lodge -
u frostread - "Read, behind lodge" /var/lib/frostread
m frostread lodge-apps
# Save-as-note calls notes' create_note through lodge's agent socket
# (group lodge-agents), with frostread's own token, scoped to one folder
# (ADR-0004). Lodge's configuration must also name frostread in "agents".
m frostread lodge-agents
