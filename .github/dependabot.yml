# Dependabot (frostyard/core ADR-0071, baseline row B13): 1 entry for each
# ecosystem with a manifest here. internal/workflowcheck checks the list.
#
# The npm and cargo entries update the web bundle and the Tauri shell; their
# lockfiles build and test in the nsl machine (make web-check, make
# app-check), as CI does. The npm git dependencies @frostyard/lodge-client
# and @frostyard/lodge-ui are lodge tags, so an update there is a lodge
# release.
#
# A gomod, npm or cargo update also changes the Flatpak's offline sources:
# its PR fails the Flatpak workflow's sources check until
# `make flatpak-sources` (nsl) is run on its branch. The repository-hygiene
# line does that.
#
# frostyard-problems (web/src-tauri) is a cargo git dependency on a tag of
# frostyard/std. Dependabot cannot resolve it: its update job tried std's tag
# v0.3.0, which holds no crate, and failed. It is bumped by hand, so the
# cargo entry ignores it; internal/workflowcheck requires an ignore entry for
# each frostyard git crate.
#
# zbus (web/src-tauri) stays on major 5: the cargo entry ignores its major
# updates and keeps its minor and patch updates. zbus 6 changes the API
# (the zbus::blocking module leaves the default API, which portal.rs uses),
# and tauri-plugin-single-instance still depends on zbus 5, so a bump alone
# would ship 2 D-Bus stacks. The shell's direct zbus dependency shares the
# zbus that single-instance brings. Port portal.rs to zbus 6, and remove
# this ignore, when the Tauri crates in Cargo.lock move to zbus 6. The cause:
# https://github.com/frostyard/frostread/pull/58#issuecomment-6715085893
# zbus_macros, zbus_names and the zvariant crates are not direct
# dependencies, so Dependabot does not raise them; they move with zbus.
#
# The commit prefix is build (or ci): svu reads it as a patch, not a feature.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: ci
      include: scope
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: build
      include: scope
    groups:
      go:
        patterns: ["*"]

  - package-ecosystem: npm
    directory: /web
    schedule:
      interval: weekly
    commit-message:
      prefix: build
      include: scope
    groups:
      web-npm:
        patterns: ["*"]

  - package-ecosystem: cargo
    directory: /web/src-tauri
    schedule:
      interval: weekly
    commit-message:
      prefix: build
      include: scope
    ignore:
      - dependency-name: frostyard-problems
      - dependency-name: zbus
        update-types: ["version-update:semver-major"]
    groups:
      web-cargo:
        patterns: ["*"]
