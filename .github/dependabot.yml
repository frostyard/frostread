# Dependabot (frostyard/core ADR-0071, baseline row B13): 1 entry for each
# ecosystem with a manifest here. internal/workflowcheck checks the list.
#
# The npm and cargo entries update the web bundle and the Tauri shell; their
# lockfiles build and test in the nsl machine (make web-check, make
# app-check), as CI does. The npm git dependencies @frostyard/lodge-client
# and @frostyard/lodge-ui are lodge tags, so an update there is a lodge
# release.
#
# A gomod, npm or cargo update also changes the Flatpak's offline sources:
# its PR fails the Flatpak workflow's sources check until
# `make flatpak-sources` (nsl) is run on its branch. The repository-hygiene
# line does that.
#
# frostyard-problems (web/src-tauri) is a cargo git dependency on a tag of
# frostyard/std. Dependabot cannot resolve it: its update job tried std's tag
# v0.3.0, which holds no crate, and failed. It is bumped by hand, so the
# cargo entry ignores it; internal/workflowcheck requires an ignore entry for
# each frostyard git crate.
#
# The commit prefix is build (or ci): svu reads it as a patch, not a feature.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: ci
      include: scope
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: build
      include: scope
    groups:
      go:
        patterns: ["*"]

  - package-ecosystem: npm
    directory: /web
    schedule:
      interval: weekly
    commit-message:
      prefix: build
      include: scope
    groups:
      web-npm:
        patterns: ["*"]

  - package-ecosystem: cargo
    directory: /web/src-tauri
    schedule:
      interval: weekly
    commit-message:
      prefix: build
      include: scope
    ignore:
      - dependency-name: frostyard-problems
    groups:
      web-cargo:
        patterns: ["*"]
