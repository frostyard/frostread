# Release (frostyard/core ADR-0011, ADR-0012, ADR-0053): a vX.Y.Z tag,
# made by `make bump CANDIDATE=vX.Y.Z-rc.N` on a tested candidate's commit,
# builds frostyard-readd_X.Y.Z_amd64.deb, attests it and attaches it to the
# GitHub release. The build job runs third-party npm code, so it holds no
# write token or id-token. The release job runs no repository code.
#
# The candidate job refuses a tag that is not the commit of a vX.Y.Z-rc.N tag
# ([frostmail ADR-0048](https://github.com/frostyard/frostmail/blob/main/docs/adr/0048-tag-each-release-on-its-tested-candidates-commit.md)).
# The .deb of a release and the Flatpak that promote.yml copies hold the same
# code. A pre-release tag vX.Y.Z-rc.N is skipped by the tags filter.
name: Release

on:
  push:
    tags: ["v*", "!v*-*"]

permissions: {}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  candidate:
    name: The tag is a tested candidate's commit
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      commit: ${{ steps.check.outputs.commit }}
    steps:
      - name: Check the tag is a candidate's commit
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if [[ ! $TAG =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "tag $TAG is not vX.Y.Z" >&2
            exit 1
          fi
          commit=$(gh api "repos/$REPO/commits/$TAG" --jq .sha)
          candidate=
          refs=$(gh api --paginate "repos/$REPO/git/matching-refs/tags/$TAG-rc." --jq '.[].ref')
          for ref in $refs; do
            name=${ref#refs/tags/}
            if [[ ! $name =~ ^v[0-9]+\.[0-9]+\.[0-9]+-rc\.[0-9]+$ ]]; then
              continue
            fi
            if [[ $(gh api "repos/$REPO/commits/$name" --jq .sha) == "$commit" ]]; then
              candidate=$name
              break
            fi
          done
          if [[ -z $candidate ]]; then
            echo "$TAG must be the commit of a tested candidate $TAG-rc.N (make it with make bump CANDIDATE=$TAG-rc.N)" >&2
            exit 1
          fi
          echo "commit=$commit" >>"$GITHUB_OUTPUT"
          echo "candidate=$candidate" >>"$GITHUB_OUTPUT"
          echo "::notice::$TAG is the commit of the candidate $candidate"

  build:
    name: Build the .deb (make deb)
    needs: candidate
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      NODE_VERSION: "24.21.0"
      COREPACK_ENABLE_DOWNLOAD_PROMPT: "0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: The checkout is the candidate's commit
        env:
          COMMIT: ${{ needs.candidate.outputs.commit }}
        run: |
          set -euo pipefail
          head=$(git rev-parse HEAD)
          if [[ $head != "$COMMIT" ]]; then
            echo "the checkout is $head, not the candidate's commit $COMMIT" >&2
            exit 1
          fi
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      # The locked nfpm, checksum-verified, as `mise install` does.
      - uses: jdx/mise-action@3c2e0cf82a5b2e5249f0d3635a4d83d0ae861518 # v4.2.5
        with:
          install: true
          install_args: nfpm
          cache: true
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
      # pnpm comes from corepack, pinned with its hash by web/package.json.
      - run: corepack enable
      - name: Build the web bundle
        run: make web-build IN_NSL='sh -c'
      - name: Build and check the .deb
        run: make deb DEB_VERSION="${GITHUB_REF_NAME#v}"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: deb
          path: dist/frostyard-readd_*_amd64.deb
          if-no-files-found: error
          retention-days: 7

  release:
    name: Attest and release
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
      id-token: write
      attestations: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: deb
          path: dist
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/frostyard-readd_*_amd64.deb
      - name: Create the release
        run: |
          gh release create "$GITHUB_REF_NAME" dist/frostyard-readd_*_amd64.deb \
            --verify-tag --generate-notes --title "$GITHUB_REF_NAME"
