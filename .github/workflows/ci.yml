# CI: the jobs of `make ci`, which runs the same gates on a developer's
# machine. Actions are pinned to full commit SHAs and jobs get only the
# permissions they need (frostyard/core ADR-0021); tools come from go.mod
# and mise.lock (ADR-0043).
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  merge_group:
  schedule:
    - cron: "17 6 * * *" # nightly, so upstream drift surfaces within a day
  workflow_dispatch:

permissions: {}

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify:
    name: Verify (make verify)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      # The locked golangci-lint, checksum-verified, as `mise install` does.
      - uses: jdx/mise-action@f5be966e4a917d54244728e6a5fdcd1d93a35e6c # v5.2.6
        with:
          install: true
          install_args: golangci-lint
          cache: true
      - name: Tidy, vet, format, lint and tests
        run: make verify

  race:
    name: Race detector and cross-builds (make race cross)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Race detector
        run: make race
      - name: linux/amd64 and linux/arm64 builds
        run: make cross

  vulncheck:
    name: Vulnerabilities (make vulncheck)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      # The govulncheck version is pinned in the Makefile, and the Go
      # checksum database verifies the module.
      - name: govulncheck
        run: make vulncheck

  web:
    name: web bundle (make web-check)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    env:
      NODE_VERSION: "24.21.0"
      COREPACK_ENABLE_DOWNLOAD_PROMPT: "0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
      # pnpm comes from corepack, pinned with its hash by web/package.json.
      # The bundle's one git dependency, @frostyard/lodge-client, is in the
      # public frostyard/lodge repository, so no token is needed.
      - run: corepack enable
      - name: Typecheck
        run: make web-check IN_NSL='sh -c'

  # The desktop app (plan 0002, step 3.5): make app-check's checks (Biome,
  # tsc and Vitest, then cargo fmt, clippy and test of web/src-tauri) and
  # make app-build's release build, on the runner itself, with the
  # WebKitGTK development packages Tauri needs. Node and Rust match the nsl
  # machine (plan 0002, 3.0's evidence). make app-e2e needs a display and
  # WebKitWebDriver, so it stays out, as it stays out of make ci.
  app:
    name: Desktop app (make app-check app-build)
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
    env:
      NODE_VERSION: "24.21.0"
      RUST_TOOLCHAIN: "1.99.0"
      COREPACK_ENABLE_DOWNLOAD_PROMPT: "0"
      # The shell's build output, kept in the workspace for the cache.
      APP_TARGET_DIR: ${{ github.workspace }}/build/cargo-target
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Tauri's system libraries
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends \
            libwebkit2gtk-4.1-dev libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev dbus
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
      # pnpm comes from corepack, pinned with its hash by web/package.json.
      - run: corepack enable
      - name: Rust ${{ env.RUST_TOOLCHAIN }}
        run: |
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal --component clippy,rustfmt
          rustup default "$RUST_TOOLCHAIN"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            build/cargo-target
          key: cargo-${{ runner.os }}-${{ env.RUST_TOOLCHAIN }}-${{ hashFiles('web/src-tauri/Cargo.lock') }}
          restore-keys: cargo-${{ runner.os }}-${{ env.RUST_TOOLCHAIN }}-
      - name: Lint, typecheck and test the web project and the shell
        run: make app-check IN_APP_NSL='sh -c' APP_TARGET_DIR="$APP_TARGET_DIR"
      - name: Release build of the app
        run: make app-build IN_APP_NSL='sh -c' APP_TARGET_DIR="$APP_TARGET_DIR"

  deb:
    name: Snapshot .deb (make deb)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    env:
      NODE_VERSION: "24.21.0"
      COREPACK_ENABLE_DOWNLOAD_PROMPT: "0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      # The locked nfpm, checksum-verified, as `mise install` does.
      - uses: jdx/mise-action@f5be966e4a917d54244728e6a5fdcd1d93a35e6c # v5.2.6
        with:
          install: true
          install_args: nfpm
          cache: true
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
      # pnpm comes from corepack, pinned with its hash by web/package.json.
      - run: corepack enable
      - name: Build the web bundle
        run: make web-build IN_NSL='sh -c'
      # A snapshot version (0.0.0-<commit>-snapshot); deb-check runs inside.
      - name: Build and check the .deb
        run: make deb
