[package]
name = "frostread"
version = "0.0.0"
description = "Read, a feed reader for Linux"
edition = "2024"
rust-version = "1.90"
license = "MIT"
publish = false

[build-dependencies]
tauri-build = { version = "2.7.1", features = [] }

[dependencies]
tauri = { version = "2.12.1", features = [] }
serde = { version = "1", features = ["derive"] }
tokio = { version = "1.53", features = ["net", "io-util", "sync", "time", "fs", "macros"] }
tauri-plugin-single-instance = "2.5.2"
tauri-plugin-dialog = "2.8.1"
tauri-plugin-opener = "2.5.5"
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }

[target.'cfg(target_os = "linux")'.dependencies]
zbus = "5.13"

[dev-dependencies]
serde_json = "1"

[profile.release]
lto = true
codegen-units = 1
strip = true
