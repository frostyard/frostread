[package]
name = "frostread"
version = "0.0.0"
description = "Read, a feed reader for Linux"
edition = "2024"
rust-version = "1.90"
license = "MIT"
publish = false

[build-dependencies]
tauri-build = { version = "2.7.1", features = [] }

[dependencies]
tauri = { version = "2.12.1", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["raw_value"] }
tokio = { version = "1.53", features = ["net", "io-util", "sync", "time", "fs", "macros"] }
tauri-plugin-single-instance = "2.5.2"
tauri-plugin-dialog = "2.8.1"
tauri-plugin-opener = "2.5.5"
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
# Problem records in the local journal (docs/specs/problem-records.md).
frostyard-problems = { git = "https://github.com/frostyard/std", tag = "v0.5.0" }

[target.'cfg(target_os = "linux")'.dependencies]
# The webview's own libraries, at the versions wry's lock already holds: the
# shell names the file input's chooser filter through them (files.rs).
gtk = "0.18"
webkit2gtk = "2.0.2"
zbus = "5.13"
tokio-tungstenite = { version = "0.30", default-features = false, features = ["connect", "handshake", "rustls-tls-webpki-roots"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }

[dev-dependencies]
tokio = { version = "1.53", features = ["test-util"] }

[profile.release]
lto = true
codegen-units = 1
strip = true
